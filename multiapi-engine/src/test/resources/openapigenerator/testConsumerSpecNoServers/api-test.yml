---
openapi: "3.1.1"
info:
  version: 1.0.0
  title: Consumer API without Servers
  description: OpenAPI 3.1.1 consumer spec without servers field
paths:
  /api/v2/warehouses:
    get:
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 0
      security:
        - bearerAuth: []
      description: Get all warehouses
      operationId: getWarehouses
      tags:
        - Warehouse
      summary: Search Warehouses
      responses:
        "200":
          description: Ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedWarehouse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
  /api/v2/warehouses/{id}:
    get:
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      security:
        - bearerAuth: []
      description: Get warehouse by ID
      operationId: getWarehouseById
      tags:
        - Warehouse
      summary: Get Warehouse
      responses:
        "200":
          description: Ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Warehouse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
components:
  schemas:
    Warehouse:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
    PaginatedWarehouse:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: "#/components/schemas/Warehouse"
        page:
          type: integer
        pageSize:
          type: integer
        totalElements:
          type: integer
    Error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: integer
        message:
          type: string
  responses:
    UnauthorizedError:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFoundError:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
