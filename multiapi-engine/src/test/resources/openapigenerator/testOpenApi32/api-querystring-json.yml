openapi: "3.2.0"
info:
  title: A query string that is not form encoded
  version: 1.0.0
paths:
  /items:
    get:
      tags: [items]
      operationId: searchItems
      parameters:
        - name: criteria
          in: querystring
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
      responses:
        '204':
          description: Searched
